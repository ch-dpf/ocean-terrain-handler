services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    command: ocean-terrain-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # jobs / tilesets / uploads on Linux named volume (fast tile I/O).
      - workspace_data:/data/workspace
      # DEM inputs stay on the host bind (usually D:) to avoid filling Docker's C: disk.
      - ./data/source:/data/workspace/source
    depends_on:
      - redis

  worker:
    build: .
    command: ocean-terrain-worker
    env_file:
      - .env
    environment:
      # Prefer named-volume mount for CTB (docker.sock); overrides host bind when set.
      WORKSPACE_DOCKER_VOLUME: ${WORKSPACE_DOCKER_VOLUME:-ocean-terrain-handler_workspace_data}
    volumes:
      - workspace_data:/data/workspace
      - ./data/source:/data/workspace/source
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis

  # Nginx: terrain tiles + Cesium preview + /api/ proxy (same-origin)
  # Open http://localhost:8103/preview/?tileset={name}
  terrain-server:
    image: nginx:latest
    ports:
      - "8103:80"
    volumes:
      # Same volume as API workspace root so relative tileset symlinks resolve.
      - workspace_data:/data
      - ./scripts/preview:/usr/share/nginx/preview:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  workspace_data:
    # Stable name so migrate scripts can reference it.
    name: ocean-terrain-handler_workspace_data
