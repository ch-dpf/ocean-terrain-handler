[project]
name = "ocean-terrain-handler"
version = "0.1.0"
description = "Terrain TIF preprocessing and Cesium terrain tile slicing service"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE.md"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "tifffile>=2024.8.30",
    "imagecodecs>=2024.6.1",
    "pyproj>=3.6.1",
]

[project.scripts]
ocean-terrain-api = "app.cli:api_main"
ocean-terrain-worker = "app.cli:worker_main"
ocean-terrain-native-check = "app.services.ctb.native_check:main"
ocean-terrain-benchmark = "benchmarks.benchmark_terrain_pipeline:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "cython>=3.0.0",
]

[build-system]
requires = ["setuptools>=75.0", "cython>=3.0", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "benchmarks*"]

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
"app.services.ctb.native" = ["*.pyx", "*.cpp", "*.hpp"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32"
build-verbosity = 1
test-command = "python -m app.services.ctb.native_check"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.ruff]
line-length = 100
target-version = "py311"
