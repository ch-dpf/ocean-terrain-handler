# Optional override: keep the entire workspace on a Windows/host bind mount.
# Use when you need to inspect jobs/tilesets directly under ./data without a volume.
#
#   docker compose -f docker-compose.yml -f docker-compose.host-data.yml up -d --build

services:
  api:
    volumes:
      - ./data:/data/workspace

  worker:
    volumes:
      - ./data:/data/workspace

  terrain-server:
    volumes:
      - ./data:/data
      - ./scripts/preview:/usr/share/nginx/preview:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
