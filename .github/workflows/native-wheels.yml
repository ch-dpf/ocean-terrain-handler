name: Native wheels

on:
  pull_request:
    paths:
      - "app/services/ctb/native/**"
      - "app/services/ctb/mesh_encode.py"
      - "app/services/ctb/native_check.py"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/native-wheels.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: Windows x64
            os: windows-latest
            arch: AMD64
          - name: macOS Intel
            os: macos-15-intel
            arch: x86_64
          - name: macOS Apple Silicon
            os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ runner.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    name: Attach wheels to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true
      - name: Create release and upload platform wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" wheelhouse/*.whl --clobber
