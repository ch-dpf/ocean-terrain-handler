name: Tests

on:
  pull_request:
  push:
    branches:
      - main-zy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential
      - name: Install package and native extension
        run: python -m pip install -e ".[dev]"
      - name: Verify native core
        run: python -m app.services.ctb.native_check
      - name: Run tests
        run: python -m pytest -q

  performance-smoke:
    name: Native end-to-end performance smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential
      - name: Install package and native extension
        run: python -m pip install -e ".[dev]"
      - name: Generate tiled DEM with overviews
        run: python -m benchmarks.generate_synthetic_dem /tmp/terrain-perf.tif --size 2048
      - name: Exercise sampling, meshing, encoding, and writes
        run: >-
          ocean-terrain-benchmark
          /tmp/terrain-perf.tif /tmp/terrain-perf-out
          --start-zoom 12 --end-zoom 7 --threads 4
          --resampling average
          --minimum-tiles-per-second 25
