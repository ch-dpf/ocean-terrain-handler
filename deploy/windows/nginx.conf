# Nginx for Windows template. Adjust the two C:/ocean-terrain-handler paths.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 2g;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8103;
        server_name localhost;

        location = / {
            return 301 /preview/$is_args$args;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ ^/tilesets/(.+\.terrain)$ {
            alias C:/ocean-terrain-handler/data/tilesets/terrain/$1;
            default_type application/vnd.quantized-mesh;
            add_header Content-Encoding gzip;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
        }

        location ~ ^/tilesets/(.+)$ {
            alias C:/ocean-terrain-handler/data/tilesets/terrain/$1;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
        }

        location /preview/ {
            alias C:/ocean-terrain-handler/scripts/preview/;
            index index.html;
        }

        location /health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
