# Install under /etc/nginx/sites-available/ocean-terrain-handler.
# This file is included from nginx's existing http{} block.

map $http_upgrade $ocean_terrain_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ocean_terrain_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 8103;
    server_name _;
    sendfile on;
    client_max_body_size 2g;

    location = / {
        return 301 /preview/$is_args$args;
    }

    location /api/ {
        proxy_pass http://ocean_terrain_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ocean_terrain_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # .terrain payloads are already gzip-compressed by the application.
    location ~ ^/tilesets/(.+\.terrain)$ {
        alias /var/lib/ocean-terrain-handler/data/tilesets/terrain/$1;
        default_type application/vnd.quantized-mesh;
        add_header Content-Encoding gzip;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ ^/tilesets/(.+)$ {
        alias /var/lib/ocean-terrain-handler/data/tilesets/terrain/$1;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /preview {
        return 301 /preview/$is_args$args;
    }

    location /preview/ {
        alias /opt/ocean-terrain-handler/scripts/preview/;
        index index.html;
    }

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
