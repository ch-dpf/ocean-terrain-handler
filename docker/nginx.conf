worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 2g;

    # WebSocket upgrade for /api/ progress push (and plain HTTP otherwise)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    types {
        application/vnd.quantized-mesh terrain;
    }

    server {
        listen 80;
        server_name localhost;

        # Docker embedded DNS — re-resolve service names when containers restart
        resolver 127.0.0.11 valid=10s ipv6=off;

        location = / {
            return 301 /preview/$is_args$args;
        }

        # Proxy FastAPI so preview page can call /api/ same-origin
        location /api/ {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Long-lived WS progress subscriptions
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Quantized-mesh tiles (gzip-compressed payloads from CTB)
        location ~ ^/tilesets/(.+\.terrain)$ {
            alias /data/tilesets/terrain/$1;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
            add_header Content-Encoding gzip;
            default_type application/vnd.quantized-mesh;
        }

        # layer.json and other tileset assets
        location ~ ^/tilesets/(.+)$ {
            alias /data/tilesets/terrain/$1;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /preview {
            return 301 /preview/$is_args$args;
        }

        location /preview/ {
            alias /usr/share/nginx/preview/;
            index index.html;
        }

        location /health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
